<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - Odisha Exam Prep</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Font & Admin Theme -->
    <link rel="stylesheet" href="admin-theme.css">
    <style>
        .login-mesh {
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.2) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
        }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        .float-icon { animation: float-slow 4s ease-in-out infinite; }
    </style>
</head>
<body class="login-mesh min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <!-- Decorative Glow Circles -->
    <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        <!-- Logo / Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 text-white shadow-xl shadow-indigo-500/25 mb-4 float-icon border border-indigo-400/30">
                <i class="fas fa-graduation-cap text-2xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Odisha Exam Prep</h1>
            <p class="text-sm text-slate-400 mt-1 font-medium">Enterprise Admin Portal & Question CMS</p>
        </div>

        <!-- Glassmorphic Login Card -->
        <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-8 shadow-2xl shadow-black/50">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                <div>
                    <h2 class="text-lg font-bold text-white">Sign In</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Enter your super-admin credentials</p>
                </div>
                <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold">
                    <i class="fas fa-shield-halved text-[11px]"></i>
                    <span>Secure</span>
                </div>
            </div>

            <!-- Form -->
            <form id="loginForm" onsubmit="return false;" class="space-y-4">
                <!-- Email Field -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fas fa-envelope text-sm"></i>
                        </span>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="admin@odishaexam.in" 
                            required
                            autocomplete="email"
                            class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all"
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                        <span class="text-[11px] text-slate-400">Firebase Encrypted</span>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fas fa-lock text-sm"></i>
                        </span>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="••••••••••••" 
                            required
                            autocomplete="current-password"
                            class="w-full pl-10 pr-11 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all"
                        >
                        <button 
                            type="button" 
                            id="togglePassword" 
                            tabindex="-1"
                            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-500 hover:text-slate-300 transition-colors focus:outline-none"
                        >
                            <i class="fas fa-eye text-sm" id="pwdEyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Error Message Banner -->
                <div id="errorMsg" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-medium flex items-start gap-2.5">
                    <i class="fas fa-circle-exclamation text-base shrink-0 mt-0.5"></i>
                    <span id="errorText"></span>
                </div>

                <!-- Login Button -->
                <button 
                    type="submit" 
                    id="loginBtn" 
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 via-blue-600 to-indigo-600 hover:from-indigo-500 hover:to-blue-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2"
                >
                    <i class="fas fa-arrow-right-to-bracket"></i>
                    <span>Login to Panel</span>
                </button>
            </form>

            <!-- Card Footer -->
            <div class="mt-6 pt-5 border-t border-slate-800/80 text-center text-xs text-slate-400">
                <p>Protected by Firebase Authentication & Role Rules</p>
            </div>
        </div>

        <!-- Footer Notice -->
        <div class="text-center mt-6 text-xs text-slate-400">
            &copy; 2026 Odisha Exam Prep. All rights reserved.
        </div>
    </div>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        import { auth } from "./firebase.js";
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Auto redirect if already signed in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.replace("dashboard.html");
            }
        });

        // Password visibility toggle
        const toggleBtn = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("pwdEyeIcon");

        if (toggleBtn && passwordInput && eyeIcon) {
            toggleBtn.addEventListener("click", () => {
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    eyeIcon.classList.remove("fa-eye");
                    eyeIcon.classList.add("fa-eye-slash");
                } else {
                    passwordInput.type = "password";
                    eyeIcon.classList.remove("fa-eye-slash");
                    eyeIcon.classList.add("fa-eye");
                }
            });
        }

        // Form Submit
        const loginForm = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");
        const errorMsg = document.getElementById("errorMsg");
        const errorText = document.getElementById("errorText");

        async function handleLogin() {
            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showError("Please enter both email and password!");
                return;
            }

            errorMsg.classList.add("hidden");
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i><span>Authenticating...</span>';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                loginBtn.innerHTML = '<i class="fas fa-check"></i><span>Success! Redirecting...</span>';
                window.location.replace("dashboard.html");
            } catch (error) {
                showError(error.message);
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i><span>Login to Panel</span>';
            }
        }

        function showError(msg) {
            errorMsg.classList.remove("hidden");
            errorText.innerText = msg;
        }

        if (loginForm) {
            loginForm.addEventListener("submit", (e) => {
                e.preventDefault();
                handleLogin();
            });
        }
    </script>
</body>
</html>
